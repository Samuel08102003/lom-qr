<script>
window.addEventListener('load', function () {
    setTimeout(function () {
        var hash = window.location.hash.replace('#', '');
        if (!hash) return;
        var p = {};
        hash.split('&').forEach(function (kv) {
            var parts = kv.split('=');
            p[parts[0]] = parseFloat(parts[1]);
        });
        if (!p.lat || !p.lng) return;
        var theMap = Object.values(window).find(function(v) {
            return v && v._leaflet_id && typeof v.setView === 'function';
        });
        if (!theMap) return;
        theMap.setView([p.lat, p.lng], p.zoom || 16);
        var mejor = null, mejorDist = Infinity;
        theMap.eachLayer(function (layer) {
            try {
                if (!layer.getLatLng || !layer.getPopup || !layer.getPopup()) return;
                var ll = layer.getLatLng();
                var d = Math.sqrt(Math.pow(ll.lat - p.lat, 2) + Math.pow(ll.lng - p.lng, 2));
                if (d < mejorDist) { mejorDist = d; mejor = layer; }
            } catch (e) {}
        });
        if (mejor && mejorDist < 0.1) {
            setTimeout(function () { mejor.openPopup(); }, 400);
        }
    }, 1200);
});
</script>
