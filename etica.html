<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Código de Ética y Conducta — LOM SAS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh;
         display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);
          max-width:360px;width:100%;overflow:hidden;text-align:center;}
    .header{background:#1a1a2e;color:#fff;padding:24px 20px 20px;}
    .header-sub{font-size:.7em;opacity:.6;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
    .header-title{font-size:1.1em;font-weight:700;line-height:1.35;}
    .header-doc{font-size:.65em;opacity:.5;margin-top:6px;}
    .body{padding:28px 24px 24px;}
    .qr-wrap{display:inline-block;padding:12px;background:#fff;
             border:1.5px solid #eee;border-radius:12px;margin-bottom:20px;}
    .qr-wrap img{display:block;width:200px;height:200px;}
    .scan-lbl{font-size:.72em;color:#aaa;margin-bottom:20px;}
    .btn{display:block;padding:14px;border-radius:10px;text-decoration:none;
         font-weight:700;font-size:.88em;margin-bottom:10px;}
    .btn-primary{background:#1a1a2e;color:#fff;}
    .btn-secondary{background:#f0f2f5;color:#333;border:1px solid #ddd;}
    .footer{font-size:.62em;color:#ccc;margin-top:16px;letter-spacing:.04em;}
  </style>
</head>
<body>
  <div class="card">

      <div class="header-doc">CDT-GTH-02</div>
    </div>
    <div class="body">
      <div class="qr-wrap">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&bgcolor=ffffff&color=1a1a2e&qzone=1&data=https%3A%2F%2Fsamuel08102003.github.io%2Flom-qr%2Fcodigo_etica_lom.pdf"
             alt="QR Código de Ética LOM" />
      </div>
      <p class="scan-lbl">Escanea para ver el documento</p>
      <a class="btn btn-primary" href="codigo_etica_lom.pdf" target="_blank">
        &#128196; Ver documento
      </a>
      <a class="btn btn-secondary" href="codigo_etica_lom.pdf" download>
        &#8595; Descargar PDF
      </a>

    </div>
