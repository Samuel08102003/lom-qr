<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRANJA — Sitio 3 - LOM SAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f6fa; }
    header {
      background: #e74c3c; color: #fff;
      padding: 24px 16px; text-align: center;
    }
    h1 { font-size: 1.5em; font-weight: 700; }
    .sub { font-size: .82em; opacity: .85; margin-top: 5px; }
    .card {
      background: #fff; margin: 14px;
      border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .label {
      font-size: .72em; font-weight: 700; color: #999;
      text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 12px;
    }
    ul { list-style: none; }
    li {
      padding: 9px 0; border-bottom: 1px solid #f0f0f0;
      font-size: .92em; color: #2d3436;
    }
    li::before { content: "› "; color: #e74c3c; font-weight: 700; }
    li:last-child { border: none; }
    .mapa-wrap { margin: 0 14px 14px; }
    iframe {
      width: 100%; height: 300px; border: 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .btn {
      display: block; background: #e74c3c; color: #fff;
      text-align: center; padding: 15px;
      border-radius: 12px; text-decoration: none;
      font-weight: 700; margin: 0 14px 28px;
      font-size: .95em;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <header>
    <h1>GRANJA — Sitio 3</h1>
    <p class="sub">Inversiones Agropecuarias LOM SAS</p>
  </header>

  <div class="card">
    <p class="label">Activos — 7 registros</p>
    <ul>
    <li>Naves Sitio 3</li>
    <li>Campamentos</li>
    <li>Separador y sis. riego de porquinaza</li>
    <li>Silos</li>
    <li>Elevador concentrado</li>
    <li>Planta electrica 2</li>
    <li>Planta electrica 3</li>
    </ul>
  </div>

  <!-- Mapa folium de la finca centrado en esta zona -->
  <div class="mapa-wrap">
    <iframe src="index.html#lat=3.977696&lng=-72.450737&zoom=16" loading="lazy" allowfullscreen></iframe>
  </div>

  <a class="btn" href="index.html#lat=3.977696&lng=-72.450737&zoom=16">Ver en el mapa de la finca</a>
</body>
</html>
