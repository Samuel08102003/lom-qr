async function loadRecords() {
  const { data, error } = await db
    .from("lom_mantenimientos")
    .select("*")
    .eq("zona_slug", ZONA_SLUG)
    .order("created_at", { ascending: false });
  if (error) throw error;
  return (data || []).map(fromDB);
}

async function getNextConsecutivo() {
  const year = new Date().getFullYear();
  const { data } = await db
    .from("lom_mantenimientos")
    .select("consecutivo")
    .eq("zona_slug", ZONA_SLUG)
    .like("consecutivo", `MI-${year}-%`);
  const nums = (data || []).map(r => {
    const m = (r.consecutivo || "").match(/MI-\d{4}-(\d+)/);
    return m ? parseInt(m[1]) : 0;
  });
  const seq = (nums.length ? Math.max(...nums) : 0) + 1;
  return `MI-${year}-${String(seq).padStart(3, "0")}`;
}

async function uploadFoto(id, dataUrl) {
  const [header, b64] = dataUrl.split(",");
  const mime = (header.match(/:(.*?);/) || [])[1] || "image/jpeg";
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  const blob = new Blob([arr], { type: mime });
  const path = `${ZONA_SLUG}/${id}.jpg`;
  const { error } = await db.storage.from(BUCKET).upload(path, blob, {
    contentType: "image/jpeg",
    upsert: true,
  });
  if (error) throw error;
  return path;
}

async function removeFoto(path) {
  if (!path) return;
  await db.storage.from(BUCKET).remove([path]);
}

function newId() {

function resizeImage(file, maxDim=1100, q=0.62) {
  return new Promise((res,rej) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width>height && width>maxDim){ height=(height*maxDim)/width; width=maxDim; }
        else if(height>maxDim){ width=(width*maxDim)/height; height=maxDim; }
        const c=document.createElement("canvas"); c.width=width; c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        res(c.toDataURL("image/jpeg",q));
      };
      img.onerror=rej; img.src=e.target.result;
    };
    reader.onerror=rej; reader.readAsDataURL(file);
  });
}

          ) : loadError ? (
            <div className="mt-8 rounded-2xl border border-red-200 bg-red-50 p-6 text-center">
              <AlertCircle size={32} className="mx-auto mb-3 text-red-400" />
              <p className="font-semibold text-red-700">Error de conexión</p>
              <p className="mt-1 text-sm text-red-600">{loadError}</p>
              <button onClick={() => { setLoadError(null); setLoading(true); loadRecords().then(setRecords).catch(e => setLoadError(e.message)).finally(() => setLoading(false)); }}
                className="mt-4 inline-flex items-center gap-2 rounded-full px-5 py-2 text-sm font-semibold text-white" style={{ background:C.clay }}>
                Reintentar
              </button>
            </div>
          ) : (
            <>
              {view==="home" && (
                <HomeView areas={AREAS} countArea={countArea} totalRegistros={records.length} totalCosto={totalCosto}
                  query={query} setQuery={setQuery} searchResults={searchResults}
                  openArea={a => { setArea(a); setView("area"); }}
                  openRecord={r => { setCurrent(r); setView("detail"); }} />
              )}
              {view==="area" && area && (
                <AreaView area={area} countFor={countFor} openItem={it => { setItem(it); setView("item"); }} />
              )}
              {view==="item" && item && area && (
                <ItemView area={area} itemName={item}
                  records={records.filter(r => r.areaId===area.id && r.itemName===item)}
                  onNew={() => { setCurrent(null); setView("form"); }}
                  openRecord={r => { setCurrent(r); setView("detail"); }} />
              )}
              {view==="form" && (
                <RecordForm area={area} itemName={item} existing={current}
                  onCancel={() => setView(item?"item":"home")} onSave={handleSave} />
              )}
              {view==="detail" && current && (
                <DetailView record={current}
                  onEdit={() => { setArea(AREAS.find(a => a.id===current.areaId)); setItem(current.itemName); setView("form"); }}
                  onDelete={handleDelete} />
              )}
            </>
          )}
        </main>

        {view==="item" && (
          <button onClick={() => { setCurrent(null); setView("form"); }}
            className="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 rounded-full px-5 py-3 text-white font-semibold shadow-lg active:scale-95 transition"
            style={{ background:C.orange }}>
            <Plus size={20} /> Registrar mantenimiento
          </button>
        )}
      </div>
    </div>
  );
}

// ── HOME ─────────────────────────────────────────────────────────────────
function HomeView({ areas, countArea, totalRegistros, totalCosto, query, setQuery, searchResults, openArea, openRecord }) {
  return (
    <div className="space-y-5">
      <div className="overflow-hidden rounded-2xl shadow-sm border border-stone-200 bg-white">
        <div className="relative px-5 pt-5 pb-0" style={{ background:"linear-gradient(180deg,#3c5b34,#33502f)" }}>
          <p style={serif} className="text-white text-xl font-bold leading-tight">Registro de mantenimiento de instalaciones</p>
          <p className="text-white/70 text-xs mt-0.5 mb-3">Cada arreglo con su fecha, foto y factura</p>
          <Lomas className="w-full" />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-2xl bg-white p-4 shadow-sm border border-stone-200">
          <div className="flex items-center gap-2 text-stone-500 text-xs font-medium"><FileText size={14} /> Registros</div>
          <div className="mt-1 text-2xl font-bold" style={{ color:C.green }}>{totalRegistros}</div>
        </div>
        <div className="rounded-2xl bg-white p-4 shadow-sm border border-stone-200">
          <div className="flex items-center gap-2 text-stone-500 text-xs font-medium"><TrendingUp size={14} /> Inversión total</div>
          <div className="mt-1 text-2xl font-bold" style={{ color:C.clay }}>{fmtCOP(totalCosto)}</div>
        </div>
      </div>

      <div className="relative">
        <Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
        <input value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Buscar por corral, factura, consecutivo…"
          className="w-full rounded-xl border border-stone-200 bg-white py-2.5 pl-10 pr-3 text-sm outline-none focus:border-[#33502f] focus:ring-1 focus:ring-[#33502f]" />
      </div>

      {query.trim() ? (
        <div className="space-y-2">
          <p className="text-xs text-stone-500">{searchResults.length} resultado(s)</p>
          {searchResults.map(r => <RecordRow key={r.id} r={r} onClick={() => openRecord(r)} showArea />)}
          {searchResults.length===0 && <p className="py-8 text-center text-stone-400 text-sm">Sin coincidencias.</p>}
        </div>
      ) : (
        <div>
          <h2 className="mb-2 text-base font-bold" style={{ ...serif, color:C.green }}>Áreas de la granja</h2>
          <div className="grid grid-cols-2 gap-3">
            {areas.map(a => {
              const n = countArea(a.id);
              return (
                <button key={a.id} onClick={() => openArea(a)}
                  className="group flex flex-col items-start gap-3 rounded-2xl bg-white p-4 text-left shadow-sm border border-stone-200 hover:shadow-md hover:border-[#a94f38] active:scale-[.98] transition">
                  <span className="rounded-xl p-2.5 transition" style={{ background:"rgba(51,80,47,0.10)", color:C.green }}>
                    <a.Icon size={22} />
                  </span>
                  <span className="font-semibold leading-tight text-sm">{a.name}</span>
                  <span className="text-xs text-stone-400">{n} {n===1?"registro":"registros"}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── ÁREA ─────────────────────────────────────────────────────────────────
function AreaView({ area, countFor, openItem }) {
  return (
    <div className="space-y-2">
      {area.items.map(it => {
        const n = countFor(area.id, it);
        return (
          <button key={it} onClick={() => openItem(it)}
            className="flex w-full items-center justify-between rounded-xl bg-white p-4 text-left shadow-sm border border-stone-200 hover:border-[#a94f38] active:scale-[.99] transition">
            <div className="flex items-center gap-3">
              <Package size={18} className="text-stone-400" />
              <span className="font-medium text-sm">{it}</span>
            </div>
            <span className="rounded-full px-2.5 py-0.5 text-xs font-semibold"
              style={n ? { background:"rgba(51,80,47,0.10)", color:C.green } : { background:"#f5f5f4", color:"#a8a29e" }}>{n}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── ÍTEM ─────────────────────────────────────────────────────────────────
function ItemView({ area, itemName, records, onNew, openRecord }) {
  const sorted = [...records].sort((a,b) => sortKey(b).localeCompare(sortKey(a)));
  const costo = records.reduce((s,r) => s+(Number(r.costo)||0), 0);
  return (
    <div className="space-y-3">
      {records.length > 0 && (
        <div className="flex gap-3 rounded-xl bg-white p-3 shadow-sm border border-stone-200 text-center text-xs">
          <div className="flex-1"><div className="text-lg font-bold" style={{ color:C.green }}>{records.length}</div><div className="text-stone-400">mantenimientos</div></div>
          <div className="w-px bg-stone-200" />
          <div className="flex-1"><div className="text-lg font-bold" style={{ color:C.clay }}>{fmtCOP(costo)}</div><div className="text-stone-400">invertido</div></div>
        </div>
      )}
      {sorted.length===0 ? (
        <div className="rounded-2xl border-2 border-dashed border-stone-300 bg-white/50 py-14 text-center">
          <Wrench className="mx-auto mb-2 text-stone-300" size={36} />
          <p className="text-sm text-stone-500">Aún no hay mantenimientos en <b>{itemName}</b>.</p>
          <button onClick={onNew} className="mt-4 inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-white" style={{ background:C.green }}>
            <Plus size={16} /> Registrar el primero
          </button>
        </div>
      ) : sorted.map(r => <RecordRow key={r.id} r={r} onClick={() => openRecord(r)} />)}
    </div>
  );
}

// ── Fila de registro ──────────────────────────────────────────────────────
function RecordRow({ r, onClick, showArea }) {
  return (
    <button onClick={onClick}
      className="flex w-full items-start gap-3 rounded-xl bg-white p-3.5 text-left shadow-sm border border-stone-200 hover:border-[#a94f38] active:scale-[.99] transition">
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 flex-wrap">
          {r.consecutivo && <span className="text-[10px] font-bold text-stone-400">{r.consecutivo}</span>}
          <span className={`rounded-md border px-1.5 py-0.5 text-[10px] font-bold ${tipoStyle[r.tipo]||""}`}>{r.tipo}</span>
          {r.prioridad && <span className={`rounded-md border px-1.5 py-0.5 text-[10px] font-bold ${prioridadStyle[r.prioridad]||""}`}>{r.prioridad}</span>}
          <span className={`rounded-md px-1.5 py-0.5 text-[10px] font-semibold ${estadoStyle[r.estado]||""}`}>{r.estado}</span>
          {!!r.fotoPath && <Camera size={13} className="text-stone-400" />}
          {r.afecta==="Sí" && <ShieldAlert size={13} className="text-red-500" />}
        </div>
        <p className="mt-1 font-medium text-sm leading-snug line-clamp-2">{trabajoDe(r)}</p>
        <div className="mt-1 flex items-center gap-2 text-xs text-stone-400 flex-wrap">
          <span className="flex items-center gap-1"><Calendar size={12} /> {fmtFecha(sortKey(r))}</span>
          {showArea && <span className="truncate">· {r.areaName} / {r.itemName}</span>}
          {r.corrales && <span>· Corrales: {r.corrales}</span>}
        </div>
      </div>
      <div className="text-sm font-bold shrink-0" style={{ color:C.clay }}>{fmtCOP(r.costo)}</div>
    </button>
  );
}

// ── Formulario ────────────────────────────────────────────────────────────
const inp = "w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#33502f] focus:ring-1 focus:ring-[#33502f]";

function Field({ label, children }) {
  return <label className="block"><span className="mb-1 block text-xs font-semibold text-stone-500">{label}</span>{children}</label>;
}
function Section({ title, icon:Icon, children }) {
  return (
    <div className="rounded-2xl bg-white p-4 shadow-sm border border-stone-200 space-y-3">
      <div className="flex items-center gap-2 border-b border-stone-100 pb-2">
        <Icon size={16} style={{ color:C.clay }} />
        <h3 style={serif} className="font-bold">{title}</h3>
      </div>
      {children}
    </div>
  );
}

function RecordForm({ area, itemName, existing, onCancel, onSave }) {
  const isCorrales = itemName?.toLowerCase().includes("corrales");
  const [f, setF] = useState({
    fechaReporte:    existing?.fechaReporte    || todayISO(),
    fechaEjecucion:  existing?.fechaEjecucion  || todayISO(),
    corrales:        existing?.corrales        || "",
    tipo:            existing?.tipo            || "Correctivo",
    prioridad:       existing?.prioridad       || "Media",
    problema:        existing?.problema        || "",
    trabajo:         existing?.trabajo         || "",
    afecta:          existing?.afecta          || "No",
    afectaDetalle:   existing?.afectaDetalle   || "",
    materiales:      existing?.materiales      || "",
    numFactura:      existing?.numFactura      || "",
    proveedor:       existing?.proveedor       || "",
    costo:           existing?.costo           ?? "",
    responsable:     existing?.responsable     || RESP_DEFAULT,
    tipoResponsable: existing?.tipoResponsable || "Interno",
    verificadoPor:   existing?.verificadoPor   || "",
    impactoVidaUtil: existing?.impactoVidaUtil || "",
    estado:          existing?.estado          || "Terminado",
  });
  const [photo, setPhoto]           = useState(null);
  const [removePhoto, setRemovePhoto] = useState(false);
  const [busy, setBusy]             = useState(false);
  const [err, setErr]               = useState("");
  const fileRef = useRef();

  const existingPhotoUrl = existing?.fotoPath ? photoUrlFor(existing.fotoPath) : null;
  const shownPhoto = photo || (!removePhoto ? existingPhotoUrl : null);

  const upd = (k,v) => setF(s => ({ ...s, [k]:v }));

  const onFile = async (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    try { setPhoto(await resizeImage(file)); setRemovePhoto(false); }
    catch { setErr("No se pudo procesar la imagen."); }
  };

  const submit = async () => {
    if(!f.trabajo.trim()) { setErr("Escribe el trabajo realizado."); return; }
    setBusy(true); setErr("");
    try {
      const data = {
        id: existing?.id,
        consecutivo: existing?.consecutivo,
        fotoPath: existing?.fotoPath || null,
        areaId: area.id, areaName: area.name, itemName,
        ...f,
        costo: f.costo===""?0:Number(f.costo),
      };
      await onSave(data, photo, removePhoto);
    } catch(e) {
      setErr("Error al guardar: " + (e.message || e));
    }
    setBusy(false);
  };

  return (
    <div className="space-y-4">
      <div className="rounded-lg px-3 py-2 text-xs" style={{ background:"rgba(51,80,47,0.07)", color:C.green }}>
        <b>{area?.name}</b> · {itemName}
        {existing?.consecutivo ? ` · ${existing.consecutivo}` : " · consecutivo se asigna al guardar"}
      </div>

      <Section title="Diagnóstico" icon={AlertCircle}>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Fecha de reporte"><input type="date" value={f.fechaReporte} onChange={e => upd("fechaReporte",e.target.value)} className={inp} /></Field>
          <Field label="Fecha de ejecución"><input type="date" value={f.fechaEjecucion} onChange={e => upd("fechaEjecucion",e.target.value)} className={inp} /></Field>
        </div>
        {isCorrales && (
          <Field label="¿Cuáles corrales?">
            <input value={f.corrales} onChange={e => upd("corrales",e.target.value)} placeholder="Ej: 5, 8, 12  —  o  —  todos" className={inp} />
          </Field>
        )}
        <Field label="Descripción del problema / motivo">
          <textarea value={f.problema} onChange={e => upd("problema",e.target.value)} rows={2} placeholder="Ej: Gotera sobre el corral, humedad en la cama" className={inp} />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Tipo"><select value={f.tipo} onChange={e => upd("tipo",e.target.value)} className={inp}>{TIPOS.map(t => <option key={t}>{t}</option>)}</select></Field>
          <Field label="Prioridad"><select value={f.prioridad} onChange={e => upd("prioridad",e.target.value)} className={inp}>{PRIORIDADES.map(t => <option key={t}>{t}</option>)}</select></Field>
        </div>
      </Section>

      <Section title="Trabajo y evidencia" icon={Wrench}>
        <Field label="Trabajo realizado">
          <textarea value={f.trabajo} onChange={e => upd("trabajo",e.target.value)} rows={2} placeholder="Ej: Reemplazo de teja y sellado con silicona" className={inp} />
        </Field>
        <Field label="Materiales / insumos usados">
          <input value={f.materiales} onChange={e => upd("materiales",e.target.value)} placeholder="Ej: 2 tejas, sellante" className={inp} />
        </Field>
        <Field label="Foto del arreglo (opcional)">
          {shownPhoto ? (
            <div className="relative">
              <img src={shownPhoto} alt="Arreglo" className="w-full rounded-xl object-cover max-h-64" />
              <button onClick={() => { setPhoto(null); setRemovePhoto(true); if(fileRef.current) fileRef.current.value=""; }}
                className="absolute top-2 right-2 rounded-full bg-black/60 p-1.5 text-white hover:bg-black/80"><XIcon size={16} /></button>
            </div>
          ) : (
            <button onClick={() => fileRef.current?.click()}
              className="flex w-full items-center justify-center gap-2 rounded-xl border-2 border-dashed border-stone-300 py-6 text-stone-500 hover:border-[#a94f38] hover:text-[#a94f38] transition">
              <Camera size={20} /> Tomar / subir foto
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onFile} className="hidden" />
        </Field>
      </Section>

      <Section title="Impacto" icon={ShieldAlert}>
        <Field label="¿Afecta la bioseguridad o el bienestar animal?">
          <div className="flex gap-2">
            {["No","Sí"].map(op => (
              <button key={op} onClick={() => upd("afecta",op)}
                className={`flex-1 rounded-xl border py-2 text-sm font-semibold transition ${f.afecta===op
                  ? op==="Sí" ? "bg-red-600 border-red-600 text-white" : "bg-[#33502f] border-[#33502f] text-white"
                  : "border-stone-300 text-stone-500 hover:bg-stone-50"}`}>{op}</button>
            ))}
          </div>
        </Field>
        {f.afecta==="Sí" && (
          <Field label="¿En qué afecta?">
            <input value={f.afectaDetalle} onChange={e => upd("afectaDetalle",e.target.value)} placeholder="Ej: humedad, riesgo respiratorio" className={inp} />
          </Field>
        )}
        <Field label="Para qué sirve / impacto en vida útil">
          <input value={f.impactoVidaUtil} onChange={e => upd("impactoVidaUtil",e.target.value)} placeholder="Ej: +2 años · evita corrosión · alarga el motor" className={inp} />
        </Field>
      </Section>

      <Section title="Soporte y cierre" icon={FileText}>
        <div className="grid grid-cols-2 gap-3">
          <Field label="N° factura / cuenta"><input value={f.numFactura} onChange={e => upd("numFactura",e.target.value)} placeholder="Ej: FV-0452" className={inp} /></Field>
          <Field label="Costo (COP)"><input type="number" inputMode="numeric" value={f.costo} onChange={e => upd("costo",e.target.value)} placeholder="90000" className={inp} /></Field>
        </div>
        <Field label="Proveedor / dónde se compró">
          <input value={f.proveedor} onChange={e => upd("proveedor",e.target.value)} placeholder="Ej: Ferretería El Campo" className={inp} />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Responsable"><input value={f.responsable} onChange={e => upd("responsable",e.target.value)} className={inp} /></Field>
          <Field label="Ejecutor">
            <select value={f.tipoResponsable} onChange={e => upd("tipoResponsable",e.target.value)} className={inp}>
              <option>Interno</option><option>Externo</option>
            </select>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Verificado por"><input value={f.verificadoPor} onChange={e => upd("verificadoPor",e.target.value)} placeholder="Ej: Coordinador" className={inp} /></Field>
          <Field label="Estado">
            <select value={f.estado} onChange={e => upd("estado",e.target.value)} className={inp}>
              {ESTADOS.map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
        </div>
      </Section>

      {err && <p className="flex items-center gap-1.5 text-sm text-red-600"><AlertCircle size={15} /> {err}</p>}
      <div className="flex gap-3 pt-1">
        <button onClick={onCancel} className="flex-1 rounded-xl border border-stone-300 py-2.5 font-semibold text-stone-600 hover:bg-stone-50">Cancelar</button>
        <button onClick={submit} disabled={busy}
          className="flex-1 flex items-center justify-center gap-2 rounded-xl py-2.5 font-semibold text-white disabled:opacity-60" style={{ background:C.green }}>
          <Check size={18} /> {busy ? "Guardando…" : "Guardar"}
        </button>
      </div>
    </div>
  );
}

// ── Detalle ───────────────────────────────────────────────────────────────
function DetailView({ record, onEdit, onDelete }) {
  const [confirmDel, setConfirmDel] = useState(false);
  const photoUrl = record.fotoPath ? photoUrlFor(record.fotoPath) : null;

  return (
    <div className="space-y-4">
      <div className="rounded-2xl bg-white shadow-sm border border-stone-200 overflow-hidden">
        {photoUrl && <img src={photoUrl} alt="Arreglo" className="w-full object-cover max-h-72" />}
        <div className="p-4 space-y-3">
          <div className="flex items-center gap-1.5 flex-wrap">
            {record.consecutivo && (
              <span className="flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-bold text-white" style={{ background:C.clay }}>
                <Hash size={12} />{record.consecutivo}
              </span>
            )}
            <span className={`rounded-md border px-2 py-0.5 text-xs font-bold ${tipoStyle[record.tipo]||""}`}>{record.tipo}</span>
            {record.prioridad && <span className={`rounded-md border px-2 py-0.5 text-xs font-bold ${prioridadStyle[record.prioridad]||""}`}>{record.prioridad}</span>}
            <span className={`rounded-md px-2 py-0.5 text-xs font-semibold ${estadoStyle[record.estado]||""}`}>{record.estado}</span>
          </div>
          <h2 style={serif} className="text-lg font-bold leading-snug">{trabajoDe(record)}</h2>
          <p className="text-xs text-stone-400">{record.areaName} · {record.itemName}{record.corrales?` · Corrales: ${record.corrales}`:""}</p>
          {record.problema && (
            <div className="rounded-lg bg-stone-50 px-3 py-2 text-sm">
              <span className="text-xs font-semibold text-stone-400">Problema / motivo</span>
              <p className="text-stone-700">{record.problema}</p>
            </div>
          )}
          {record.afecta==="Sí" && (
            <div className="flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
              <ShieldAlert size={16} className="mt-0.5 shrink-0" />
              <span><b>Afecta bioseguridad / bienestar.</b>{record.afectaDetalle?` ${record.afectaDetalle}`:""}</span>
            </div>
          )}
          <dl className="divide-y divide-stone-100 text-sm">
            <Row icon={Calendar}       label="Reporte"        value={fmtFecha(record.fechaReporte)} />
            <Row icon={Calendar}       label="Ejecución"      value={fmtFecha(record.fechaEjecucion)} />
            <Row icon={Layers}         label="Materiales"     value={record.materiales||"—"} />
            <Row icon={User}           label="Responsable"    value={`${record.responsable||"—"} (${record.tipoResponsable||"—"})`} />
            <Row icon={FileText}       label="Factura"        value={record.numFactura||"—"} />
            <Row icon={Package}        label="Proveedor"      value={record.proveedor||"—"} />
            <Row icon={TrendingUp}     label="Costo"          value={fmtCOP(record.costo)} strong />
            <Row icon={Flag}           label="Vida útil"      value={record.impactoVidaUtil||"—"} />
            <Row icon={ClipboardCheck} label="Verificado por" value={record.verificadoPor||"—"} />
          </dl>
          {!photoUrl && <p className="rounded-lg bg-stone-50 px-3 py-2 text-xs text-stone-400">Sin foto adjunta.</p>}
        </div>
      </div>
      <div className="flex gap-3">
        <button onClick={onEdit} className="flex-1 flex items-center justify-center gap-2 rounded-xl border border-stone-300 py-2.5 font-semibold text-stone-700 hover:bg-stone-50">
          <Pencil size={16} /> Editar
        </button>
        {confirmDel ? (
          <button onClick={() => onDelete(record.id)} className="flex-1 flex items-center justify-center gap-2 rounded-xl bg-red-600 py-2.5 font-semibold text-white hover:bg-red-700">
            <Trash2 size={16} /> Confirmar
          </button>
        ) : (
          <button onClick={() => setConfirmDel(true)} className="flex items-center justify-center gap-2 rounded-xl border border-red-200 px-4 py-2.5 font-semibold text-red-600 hover:bg-red-50">
            <Trash2 size={16} />
          </button>
        )}
      </div>
    </div>
  );
}

function Row({ icon:Icon, label, value, strong }) {
  return (
    <div className="flex items-center justify-between gap-3 py-2.5">
      <span className="flex items-center gap-2 text-stone-500 shrink-0"><Icon size={15} /> {label}</span>
      <span className={`text-right ${strong?"font-bold":"font-medium text-stone-700"}`}
        style={strong?{ color:C.clay }:undefined}>{value}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
